<!doctype html><meta charset="utf-8"><title>Slow portal</title><link rel="stylesheet" href="/portal.css">
<main id="app"><p>Loading…</p></main>
<script>
  // Like a portal built with a JavaScript framework: the login form is drawn after the page has loaded.
  setTimeout(() => {
    document.getElementById("app").innerHTML =
      '<h1>Portal login</h1><form method="post" action="/login">' +
      '<label>Username <input name="username"></label><label>Password <input name="password" type="password"></label>' +
      '<button type="submit">Sign in</button></form>';
  }, 1500);
</script>
