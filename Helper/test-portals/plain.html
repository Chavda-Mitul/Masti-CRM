<!doctype html><meta charset="utf-8"><title>Plain portal</title><link rel="stylesheet" href="/portal.css">
<header><strong>Plain Visa Portal</strong><input type="search" placeholder="Search" style="width:200px"><a href="#">Sign in</a></header>
<main>
  <h1>Agent login</h1>
  <form method="post" action="/login">
    <label for="uid">User ID</label><input id="uid" name="uid">
    <label for="pwd">Password</label><input id="pwd" name="pwd" type="password">
    <button type="button" onclick="alert('Forgot password')">Forgot password?</button>
    <button type="submit">Login</button>
  </form>
</main>
